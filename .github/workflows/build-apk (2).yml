name: APK oluştur

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Kodu al
        uses: actions/checkout@v5

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Android SDK lisanslarını kabul et (SDK sunucuda hazır)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - name: Proje klasörünü bul (dosyalar alt klasörde de olabilir)
        run: |
          F=$(find . -name settings.gradle -not -path './.git/*' | head -1)
          if [ -z "$F" ]; then
            # depoya zip dosyasının kendisi yüklendiyse onu açar
            Z=$(find . -iname '*.zip' -not -path './.git/*' | head -1)
            if [ -n "$Z" ]; then echo "Zip bulundu, açılıyor: $Z"; mkdir -p _proje && unzip -q -o "$Z" -d _proje; F=$(find ./_proje -name settings.gradle | head -1); fi
          fi
          if [ -z "$F" ]; then echo "Depodaki dosyalar:"; find . -not -path './.git/*' | head -60; fi
          if [ -z "$F" ]; then echo "::error::settings.gradle bulunamadı. Zip'teki dosyaların hepsini (app klasörü, build.gradle, settings.gradle, gradle.properties) depoya yükleyin."; ls -R | head -50; exit 1; fi
          D=$(dirname "$F"); echo "Proje klasörü: $D"; echo "PROJ=$D" >> "$GITHUB_ENV"

      - name: three.js kütüphanesini uygulamaya göm (internetsiz çalışsın)
        run: |
          cd "$PROJ"
          curl -fsSL -o app/src/main/assets/three.min.js https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js \
          || curl -fsSL -o app/src/main/assets/three.min.js https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js \
          || echo "three.js indirilemedi; oyun açılışta internetten yükleyecek"

      - name: APK derle
        run: cd "$PROJ" && gradle assembleDebug --no-daemon --stacktrace

      - name: APK'yı adlandır
        run: cp "$PROJ/app/build/outputs/apk/debug/app-debug.apk" KoyunCiftligi-v1.0.${{ github.run_number }}.apk

      - name: APK'yı iş çıktısı olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: KoyunCiftligi-apk
          path: KoyunCiftligi-v1.0.${{ github.run_number }}.apk

      - name: Sürüm (Release) olarak yayınla
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Koyun Çiftliği 3D v1.0.${{ github.run_number }}
          body: Telefona indirip kurun. Kurulumda "bilinmeyen kaynaklardan yükleme" iznini verin.
          files: KoyunCiftligi-v1.0.${{ github.run_number }}.apk
