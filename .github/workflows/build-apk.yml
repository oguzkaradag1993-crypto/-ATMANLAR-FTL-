name: APK oluştur

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: three.js kütüphanesini uygulamaya göm (internetsiz çalışsın)
        run: curl -fsSL -o app/src/main/assets/three.min.js https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js

      - name: APK derle
        run: gradle assembleDebug --no-daemon

      - name: APK'yı adlandır
        run: cp app/build/outputs/apk/debug/app-debug.apk KoyunCiftligi-v1.0.${{ github.run_number }}.apk

      - name: APK'yı iş çıktısı olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: KoyunCiftligi-apk
          path: KoyunCiftligi-v1.0.${{ github.run_number }}.apk

      - name: Sürüm (Release) olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Koyun Çiftliği 3D v1.0.${{ github.run_number }}
          body: Telefona indirip kurun. Kurulumda "bilinmeyen kaynaklardan yükleme" iznini verin.
          files: KoyunCiftligi-v1.0.${{ github.run_number }}.apk
